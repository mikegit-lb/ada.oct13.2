                <span class="text-xs text-sky-800 font-bold bg-sky-100 px-1.5 py-0.5 rounded">(${c[3]} / ${c[4]})</span>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </section>
    ` : ''}

    <!-- SPECIAL TURKISH ASSISTANCE GUIDE FOR UNIT 4 -->
    ${i === 3 && u.hasTrGuide ? `
    <section class="card p-5 md:p-6 bg-gradient-to-br from-white to-orange-50 border-4 border-orange-400 shadow-md" aria-labelledby="u4-tr-guide-title">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-4 pb-3 border-b-2 border-orange-200">
        <div class="flex items-center gap-2">
          <span class="text-3xl wig inline-block">🇹🇷</span>
          <div>
            <h2 id="u4-tr-guide-title" class="text-xl md:text-2xl font-extrabold text-orange-950">Unit 4: Türkçe Konu Anlatımı & Hobi Rehberi</h2>
            <p class="text-sm md:text-base text-orange-900 font-medium">Like / Don't Like kuralları, -ing ekleme kuralları, Do you like soruları ve and / but bağlaçları</p>
          </div>
        </div>
        <button type="button" class="btn !bg-orange-600 !text-sm !py-2 !px-3.5 shadow font-bold" id="u4-tr-guide-read-btn">🔊 Sesli Özeti Dinle</button>
      </div>

      <div class="grid md:grid-cols-2 gap-4 text-left">
        <!-- Kural 1: -ING Kuralı -->
        <div class="bg-white p-4 rounded-2xl border-2 border-orange-300 shadow-sm space-y-2.5">
          <div class="flex items-center gap-2 font-bold text-orange-950 text-lg">
            <span>🎯</span> <span>1. "Like / Don't Like" ve -ING Kuralı</span>
          </div>
          <p class="text-sm text-slate-700 leading-relaxed">
            İngilizce'de bir eylemi yapmayı sevdiğimizi veya sevmediğimizi söylerken, <b>like</b> ve <b>don't like</b> ifadelerinden sonra gelen fiile mutlaka <b>-ing</b> takısı eklenir:
          </p>
          <div class="bg-amber-50 border-l-4 border-amber-400 p-3 rounded-r-xl text-sm space-y-1.5">
            <div>👍 <b>Sevilen Şeyler:</b> <code class="bg-white px-1.5 py-0.5 rounded font-bold text-emerald-800">I like + Verb-ing</code></div>
            <div class="text-slate-600 pl-4">Örnek: <i>"I like <b>swimming</b>."</i> (Yüzmeyi severim.)</div>
            <div>👎 <b>Sevilmeyen Şeyler:</b> <code class="bg-white px-1.5 py-0.5 rounded font-bold text-rose-800">I don't like + Verb-ing</code></div>
            <div class="text-slate-600 pl-4">Örnek: <i>"I don't like <b>coloring</b>."</i> (Boyama yapmayı sevmem.)</div>
          </div>
          <div class="bg-rose-50 border border-rose-200 p-2 rounded-xl text-xs text-rose-800 font-semibold">
            ⚠️ <b>ÖNEMLİ YAZIM KURALI:</b> 
            <br>• Sonu 'e' ile biten fiillerde 'e' düşer: <i>ride ➔ rid<b>ing</b></i>.
            <br>• Kısa sesli + sessiz harfle bitenlerde son harf ikilenir: <i>swim ➔ swim<b>ming</b></i>.
          </div>
        </div>

        <!-- Kural 2: Do you like...? Soruları ve Kısa Cevaplar -->
        <div class="bg-white p-4 rounded-2xl border-2 border-orange-300 shadow-sm space-y-2.5">
          <div class="flex items-center gap-2 font-bold text-orange-950 text-lg">
            <span>❓</span> <span>2. "Do you like...?" Sorusu ve Kısa Cevaplar</span>
          </div>
          <p class="text-sm text-slate-700 leading-relaxed">
            Karşımızdaki kişiye bir hobiyi sevip sevmediğini sorarken ve cevap verirken bu kalıbı kullanırız:
          </p>
          <div class="p-3 bg-sky-50 rounded-xl border border-sky-200 text-sm space-y-2">
            <div>
              <span class="font-bold text-sky-900">Soru:</span> <i>"<b>Do you like</b> playing chess?"</i> (Satranç oynamayı sever misin?)
            </div>
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 bg-emerald-100 border border-emerald-300 rounded font-bold text-emerald-800">✅ Olumlu:</span>
              <i>"<b>Yes, I do.</b>"</i> (Evet, severim.)
            </div>
            <div class="flex items-center gap-2">
              <span class="px-2 py-0.5 bg-rose-100 border border-rose-300 rounded font-bold text-rose-800">❌ Olumsuz:</span>
              <i>"<b>No, I don't.</b>"</i> (Hayır, sevmem.)
            </div>
          </div>
          <div class="bg-amber-50 border border-amber-300 p-2 rounded-xl text-xs text-amber-900 font-semibold">
            💡 <b>DİKKAT:</b> <i>"Yes, I like"</i> ❌ <u>yanlıştır</u>! Kısa cevapta her zaman yardımcı fiil (do/don't) kullanılır: <i>"Yes, I do"</i> ✅.
          </div>
        </div>

        <!-- Kural 3: Bağlaçlar: AND & BUT -->
        <div class="bg-white p-4 rounded-2xl border-2 border-orange-300 shadow-sm space-y-2.5">
          <div class="flex items-center gap-2 font-bold text-orange-950 text-lg">
            <span>🔗</span> <span>3. Cümleleri Bağlama: "AND" (ve) & "BUT" (fakat/ama)</span>
          </div>
          <p class="text-sm text-slate-700 leading-relaxed">
            Birden fazla hobiden bahsederken cümleleri birbirine bağlarız:
          </p>
          <div class="space-y-2 text-sm">
            <div class="p-2.5 bg-emerald-50 rounded-xl border border-emerald-200">
              <b class="text-emerald-800">➕ AND (Ve) - İki Benzer Fikir:</b>
              <p class="text-xs text-slate-600 mt-1">İki sevdiğimiz veya iki sevmediğimiz hobiyi bağlarken kullanılır:</p>
              <div class="mt-1 font-semibold text-emerald-950">"I like swimming <b>and</b> riding a bike."</div>
            </div>
            <div class="p-2.5 bg-rose-50 rounded-xl border border-rose-200">
              <b class="text-rose-800">⚖️ BUT (Ama / Fakat) - Tezat / Zıt Fikir:</b>
              <p class="text-xs text-slate-600 mt-1">Bir sevdiğimiz, bir sevmediğimiz hobiyi birleştirirken kullanılır:</p>
              <div class="mt-1 font-semibold text-rose-950">"I like swimming, <b>but</b> I don't like skateboarding."</div>
            </div>
          </div>
        </div>

        <!-- Kural 4: 16 Hobi Sözlüğü ve Eylemler -->
        <div class="bg-white p-4 rounded-2xl border-2 border-orange-300 shadow-sm space-y-2.5">
          <div class="flex items-center gap-2 font-bold text-orange-950 text-lg">
            <span>📖</span> <span>4. 16 Temel Hobi ve Türkçe Anlamları</span>
          </div>
          <div class="grid grid-cols-2 gap-1.5 text-xs font-semibold">
            <div class="p-1.5 bg-slate-50 rounded">♟️ playing chess: satranç</div>
            <div class="p-1.5 bg-slate-50 rounded">🏓 table tennis: masa tenisi</div>
            <div class="p-1.5 bg-slate-50 rounded">🎮 computer games: bilgisayar</div>
            <div class="p-1.5 bg-slate-50 rounded">📺 watching cartoons: çizgi film</div>
            <div class="p-1.5 bg-slate-50 rounded">📚 reading comics: çizgi roman</div>
            <div class="p-1.5 bg-slate-50 rounded">🎨 drawing / coloring: boyama</div>
            <div class="p-1.5 bg-slate-50 rounded">🐴 riding a horse: ata binme</div>
            <div class="p-1.5 bg-slate-50 rounded">⚽ playing football: futbol</div>
            <div class="p-1.5 bg-slate-50 rounded">🏊 swimming: yüzme</div>
            <div class="p-1.5 bg-slate-50 rounded">🚲 riding a bike: bisiklet</div>
            <div class="p-1.5 bg-slate-50 rounded">🎸 playing the guitar: gitar</div>
            <div class="p-1.5 bg-slate-50 rounded">🪁 flying a kite: uçurtma</div>
            <div class="p-1.5 bg-slate-50 rounded">🎤 singing songs: şarkı söyleme</div>
            <div class="p-1.5 bg-slate-50 rounded">🛹 skateboarding: kaykay</div>
          </div>
        </div>
      </div>
    </section>
    ` : ''}

    <!-- 6. SPEAKING LAB -->
    <section aria-labelledby="st">
      <h2 id="st" class="sec-title mb-3">🎤 Speaking Lab: Interactive Role-Play</h2>
      <div class="card p-5 bg-white" id="lab"></div>
    </section>

    <!-- 7. PRACTICE ZONE (EXPANDED EXERCISES) -->
    <section aria-labelledby="pt">
      <div class="flex items-center justify-between flex-wrap gap-2 mb-3">
        <h2 id="pt" class="sec-title">🎮 Practice Zone & Mini-Games</h2>
        <span class="text-sm font-bold bg-amber-200 text-amber-900 px-3 py-1 rounded-full">Earn Stars & Badges!</span>
      </div>
      <div class="flex gap-2 overflow-x-auto scroll-x pb-2" id="atabs" role="tablist"></div>
      <div class="card p-5 mt-2 bg-white" id="act" role="tabpanel"></div>
    </section>`;

  // Initialize Speaking Lab
  lab($('#lab'), u.lab);

  // Initialize Quick Country & Nationality Challenge right after flashcards
  initQuickCountriesExercise($('#country-quick-challenge'));
  initWorldMapCompass($('#world-compass-hub'));

  // Initialize Unit 4 3-Lesson Practice Hub
  if (i === 3) {
    initUnit4PracticeHub($('#u4-practice-hub'));
  }

  // Hook up Turkish Guide Readout Button if present
  const trGuideBtn = $('#tr-guide-read-btn');
  if (trGuideBtn) {
    trGuideBtn.onclick = () => {
      say('Unit 2: Countries and Nationalities. Remember: I am from Türkiye, I am Turkish. He is from Britain, he is British. Samsun is in the north, Antalya is in the south, Van is in the east, and İzmir is in the west. Always use capital letters!');
      toast('🔊 Reading Unit 2 English summary!');
    };
  }

  const u4TrGuideBtn = $('#u4-tr-guide-read-btn');
  if (u4TrGuideBtn) {
    u4TrGuideBtn.onclick = () => {
      say('Unit 4: Free Time and Hobbies. After like and don\'t like, we add i-n-g to the verb. I like swimming, I don\'t like skateboarding. Do you like reading comics? Yes, I do! No, I don\'t. We use and for similar things, and but for opposites.');
      toast('🔊 Reading Unit 4 English summary!');
    };
  }

  // Story Comprehension Check
  $$('.story-chk-btn', $('#app')).forEach(btn => {
    btn.onclick = () => {
      if (btn.dataset.ok === '1') {
        btn.classList.add('!bg-emerald-500', '!text-white');
        sfx.ok();
        toast('✅ Correct story answer!');
        S.storiesRead[i] = true;
        if (Object.keys(S.storiesRead).length === 5) badge('reader');
        save();
      } else {
        btn.classList.add('!bg-rose-500', '!text-white');
        sfx.no();
        toast('Check the comic panels above!');
      }
    };
  });

  // Story Full Readout
  $('#read-story-btn').onclick = () => {
    const fullText = u.story.panels.map(p => `${p.text} ${p.bubble}`).join('. ');
    say(fullText);
  };

  // Chant Sing Along
  $('#sing-chant-btn').onclick = async () => {
    const lines = $$('.chant-line', $('#chant-box'));
    for (let l = 0; l < lines.length; l++) {
      lines.forEach(x => x.classList.remove('singing'));
      lines[l].classList.add('singing');
      sfx.drum();
      say(lines[l].dataset.say);
      await new Promise(r => setTimeout(r, 2000));
    }
    lines.forEach(x => x.classList.remove('singing'));
    game();
  };

  // Setup Activity Tabs
  const allActs = u.acts.concat([
    ['quiz', '🏆', 'Unit Final Quiz ⭐', quiz(i, u.quiz)]
  ]);

  $('#atabs').innerHTML = allActs.map((a, k) => `
    <button class="tab ${k === 0 ? 'on' : ''}" role="tab" data-k="${k}" style="color:var(--d)">
      ${a[1]} ${a[2]}
    </button>
  `).join('');

  const runAct = k => {
    $$('#atabs .tab').forEach((b, j) => b.classList.toggle('on', j === k));
    const container = $('#act');
    container.innerHTML = '';
    allActs[k][3](container);
  };

  $$('#atabs .tab').forEach(b => b.onclick = () => runAct(+b.dataset.k));
  runAct(0);

  drawHeader();
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if ('speechSynthesis' in window) speechSynthesis.cancel();
}

/* =========================================================================
   11. GLOBAL ROUTING & CONTROLS
   ========================================================================= */
const route = () => {
  const m = /^#u([1-5])$/.exec(location.hash);
  show(m ? m[1] - 1 : 0);
};

window.addEventListener('hashchange', route);

// Header Buttons
$('#snd').onclick = () => {
  S.sound = !S.sound;
  if (!S.sound && 'speechSynthesis' in window) speechSynthesis.cancel();
  save();
  drawHeader();
  toast(S.sound ? 'Sound is ON 🔊' : 'Sound Muted 🔇');
};

$('#accent').onclick = () => {
  S.accent = S.accent === 'en-GB' ? 'en-US' : 'en-GB';
  save();
  drawHeader();
  say(S.accent === 'en-GB' ? 'British English' : 'American English');
  toast(S.accent === 'en-GB' ? 'Voice: British English 🇬🇧' : 'Voice: American English 🇺🇸');
};

$('#tr-toggle').onclick = () => {
  S.trHints = !S.trHints;
  save();
  drawHeader();
  show(cur);
  toast(S.trHints ? 'Turkish Hints: ON 🇹🇷' : 'Turkish Hints: OFF');
};

$('#spd-toggle').onclick = () => {
  S.speechRate = S.speechRate === 0.85 ? 0.7 : 0.85;
  save();
  drawHeader();
  toast(S.speechRate === 0.7 ? 'Voice Speed: Slow 🐢 (0.7x)' : 'Voice Speed: Normal 🐇 (0.85x)');
};

$('#jar').onclick = () => {
  modal(`
    <div class="text-6xl mb-2 pop">🫙</div>
    <h2 class="text-3xl font-extrabold mb-1 text-slate-800">My Star Jar</h2>
    <p class="text-slate-600 mb-4 text-sm">Collect all 5 semester stars to become the Semester Champion!</p>
    <div class="flex justify-center gap-2 text-4xl mb-4 bg-amber-50 py-3 rounded-2xl border-2 border-amber-200">
      ${UNITS.map((u, i) => S.stars[i] ? '<span class="pop" title="Unit ' + u.n + ' Star">⭐</span>' : '<span class="opacity-25" title="Incomplete">☆</span>').join(' ')}
    </div>
    <div class="flex justify-around text-center mb-4">
      <div>
        <div class="text-2xl font-bold text-amber-600">${S.pts}</div>
        <div class="text-xs font-semibold text-slate-500">✨ Sparkles</div>
      </div>
      <div>
        <div class="text-2xl font-bold text-emerald-600">${S.games}</div>
        <div class="text-xs font-semibold text-slate-500">🎮 Games Played</div>
      </div>
      <div>
        <div class="text-2xl font-bold text-indigo-600">${Object.keys(S.stars).length}/5</div>
        <div class="text-xs font-semibold text-slate-500">⭐ Stars Earned</div>
      </div>
    </div>
    <h3 class="font-bold text-left text-slate-800 mb-2">My Unlocked Badges:</h3>
    <div class="grid grid-cols-2 gap-2 text-left">
      ${Object.entries(BADGES).map(([k, v]) => `
        <div class="p-2 rounded-xl border-2 ${S.badges.includes(k) ? 'border-amber-400 bg-amber-50' : 'border-slate-200 opacity-40 bg-slate-50'}">
          <div class="font-bold text-sm">${v[0]} ${v[1]}</div>
          <div class="text-xs text-slate-500">${v[2]}</div>
        </div>
      `).join('')}
    </div>
  `);
};

$('#res-bank-btn').onclick = () => {
  modal(`
    <h2 class="text-2xl font-extrabold mb-2 text-slate-800">📚 Global Vocabulary Reference & Study Notes</h2>
    <p class="text-xs text-slate-500 mb-3">Quick reference for all 5 units of the 1st Semester curriculum:</p>
    <div class="text-left space-y-4 max-h-[60vh] overflow-y-auto pr-1">
      ${UNITS.map(u => `
        <div class="border-2 rounded-2xl p-3" style="border-color:${u.th[0]}">
          <h3 class="font-bold text-base flex items-center gap-1.5" style="color:${u.th[2]}">${u.icon} Unit ${u.n}: ${u.name}</h3>
          <p class="text-xs text-slate-600 mb-2"><b>Target:</b> ${u.concept}</p>
          <div class="grid grid-cols-2 gap-1 text-xs">
            ${u.vocab.flatMap(g => g[1]).slice(0, 8).map(v => `
              <div class="bg-slate-50 p-1 rounded font-medium">${v[0]} ${v[1]} ${v[3] ? `(${v[3]})` : ''}</div>
            `).join('')}
          </div>
        </div>
      `).join('')}
    </div>
  `);
};

$('#mascot-header').onclick = () => {
  say('Hello young adventurer! Welcome to English class! Which unit do you want to play today?');
  toast('Owly: "Have fun learning English today!" 🦉');
};

$('#reset').onclick = () => {
  if (confirm('Are you sure you want to reset all your stars, badges, and progress?')) {
    S.stars = {};
    S.badges = [];
    S.pts = 0;
    S.games = 0;
    S.storiesRead = {};
    save();
    route();
    toast('Progress reset successfully! ↺');
  }
};

// Start the Application
route();
</script>
